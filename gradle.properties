org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# The Kotlin daemon otherwise defaults to cp1252 on Windows and mangles non-ASCII source text.
kotlin.daemon.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# Flaky networks: long timeouts plus retries turn a hard failure into a slow one.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
